<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#150f1c">
<meta name="robots" content="noindex, nofollow">
<title>رسالة ليكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column of pages.
   Each page = confession on top, framed photo in the middle, verse at the bottom.
   Edit mode opens a bottom sheet to change the current page live. */
:root {
  --bg: #150f1c;
  --bg-soft: #1f1629;
  --ink: #f4e8ec;
  --ink-dim: #b9a6b4;
  --rose: #e7899f;
  --gold: #d6b27a;
  --line: rgba(244, 232, 236, 0.2);
  --paper: #efe3e6;
  --f-display: 'Aref Ruqaa', 'Amiri', 'Traditional Arabic', serif;
  --f-verse: 'Amiri', 'Noto Naskh Arabic', 'Traditional Arabic', serif;
  --f-ui: 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 1rem;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60rem 36rem at 50% -8%, rgba(231, 137, 159, 0.2), transparent 62%),
    radial-gradient(40rem 28rem at 100% 100%, rgba(214, 178, 122, 0.08), transparent 60%);
  animation: breathe 9s ease-in-out infinite alternate;
}
@keyframes breathe { from { opacity: 0.65; } to { opacity: 1; } }
#petals { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
.hp { position: absolute; line-height: 1; will-change: transform, opacity; }

.wrap {
  position: relative;
  z-index: 1;
  width: min(100%, 44rem);
  margin-inline: auto;
  padding-inline: 1.25rem;
}

/* ---------- Buttons ---------- */
.btn {
  padding: 0.7rem 1.3rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.2s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: 0.3; cursor: default; }
.btn.primary { background: var(--rose); border-color: var(--rose); color: #2a0f1b; font-weight: 500; }
.btn.sm { padding: 0.5rem 0.95rem; font-size: 0.9rem; }
.btn:focus-visible, .fld:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ---------- Pages ---------- */
.letter { min-height: 100dvh; padding-block: 3.2rem 8rem; }
.editing .letter { padding-bottom: 62dvh; }
.page { display: none; flex-direction: column; gap: 1.9rem; }
.page.on { display: flex; animation: enter 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
@keyframes enter {
  from { opacity: 0; transform: translateX(var(--dx, 0px)); filter: blur(6px); }
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  margin: 0;
  color: var(--gold);
  font-size: 0.85rem;
}
.eyebrow::before, .eyebrow::after { content: ""; flex: 1; height: 1px; background: rgba(214, 178, 122, 0.3); }
.page.on .eyebrow { animation: fade 0.8s ease 0.1s backwards; }
@keyframes fade { from { opacity: 0; } }

.confession {
  margin: 0;
  text-align: center;
  text-wrap: balance;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(1.65rem, 5.6vw, 2.3rem);
  line-height: 1.85;
  outline: none;
}
.confession .w {
  display: inline-block;
  animation: wordIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
  animation-delay: calc(var(--i) * 85ms + 250ms);
}
.confession.static .w { animation: none; }
@keyframes wordIn { from { opacity: 0; transform: translateY(0.5em); filter: blur(6px); } }

.photo { margin: 0; display: grid; justify-items: center; gap: 0.7rem; }
.frame {
  --tilt: -1.2deg;
  position: relative;
  width: min(100%, 20rem);
  aspect-ratio: 4 / 5;
  padding: 0.55rem;
  background: var(--paper);
  transform: perspective(900px) rotate(var(--tilt)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.25s ease-out;
  box-shadow: 0 1.6rem 3rem rgba(0, 0, 0, 0.45), 0 0 4.5rem rgba(231, 137, 159, 0.22);
}
.page:nth-child(even) .frame { --tilt: 1deg; }
.page.on .frame { animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s backwards; }
@keyframes rise {
  from { opacity: 0; transform: perspective(900px) translateY(46px) rotate(calc(var(--tilt) * 5)); }
}
.pic { position: relative; width: 100%; height: 100%; overflow: hidden; background: #2a1d33; }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.page.on .pic img { animation: develop 2.4s ease 1s backwards; }
@keyframes develop {
  from { filter: blur(14px) sepia(1) brightness(1.7) saturate(0.3); transform: scale(1.08); }
}
.pic::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, 0.28) 50%, transparent 65%);
  transform: translateX(-130%);
  pointer-events: none;
}
.page.on .pic::after { animation: sheen 1.8s ease 2.4s 1 forwards; }
@keyframes sheen { to { transform: translateX(130%); } }
.ph {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  padding: 1rem;
  text-align: center;
  background: linear-gradient(160deg, #3a2740, #241830);
  color: var(--ink-dim);
  font-size: 0.92rem;
}
.frame.missing img { display: none; }
.frame.missing .ph { display: flex; }
.photo figcaption { color: var(--ink-dim); font-size: 0.92rem; text-align: center; }
.photo figcaption:empty { display: none; }
.page.on .photo figcaption { animation: fade 1s ease 2s backwards; }

.verse {
  margin: 0;
  display: grid;
  gap: 0.2rem;
  text-align: center;
  font-family: var(--f-verse);
  font-size: clamp(1.3rem, 4.6vw, 1.6rem);
  line-height: 2;
}
.verse p { margin: 0; text-wrap: balance; }
.orn { justify-self: center; width: 0.45rem; height: 0.45rem; margin-block: 0.45rem; background: var(--gold); transform: rotate(45deg); opacity: 0.8; }
.page.on .verse .sadr { animation: lineIn 1.1s ease 1.6s backwards; }
.page.on .verse .orn { animation: orn 0.7s ease 2.1s backwards; }
.page.on .verse .ajz { animation: lineIn 1.1s ease 2.4s backwards; }
@keyframes lineIn { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
@keyframes orn { from { opacity: 0; transform: rotate(45deg) scale(0); } }

.finale { display: grid; justify-items: center; padding-block: 2.5rem 1rem; text-align: center; }
.finale .big {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(4.5rem, 26vw, 9rem);
  line-height: 1.5;
  background: linear-gradient(120deg, var(--rose) 20%, var(--gold) 80%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 1.4rem rgba(231, 137, 159, 0.45));
}
.page.on .finale .big { animation: loveIn 1.7s cubic-bezier(0.2, 0.7, 0.2, 1) 3.2s backwards, beat 2.8s ease-in-out 4.9s infinite; }
@keyframes loveIn { from { opacity: 0; transform: scale(0.55); filter: blur(14px); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
#finaleBox { display: grid; gap: 0.55rem; }

/* ---------- Navigation ---------- */
.nav {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 2;
  padding: 1.6rem 1.25rem calc(1rem + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 55%, transparent);
}
.nav-in {
  width: min(100%, 44rem);
  margin-inline: auto;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1rem;
}
.dots { display: flex; justify-content: center; align-items: center; gap: 0.45rem; }
.dots i { width: 0.45rem; height: 0.45rem; border-radius: 999px; background: var(--line); transition: width 0.3s, background 0.3s; }
.dots i.on { width: 1.4rem; background: var(--rose); }

/* ---------- Editor ---------- */
.edit-btn {
  position: fixed;
  z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  inset-inline-end: 1rem;
  padding: 0.4rem 0.95rem;
  font-size: 0.9rem;
  background: rgba(21, 15, 28, 0.65);
  backdrop-filter: blur(6px);
}
.sheet {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 6;
  max-height: 72dvh;
  overflow: auto;
  background: var(--bg-soft);
  border-top: 1px solid var(--line);
  box-shadow: 0 -1rem 3rem rgba(0, 0, 0, 0.5);
  padding: 1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px));
  animation: sheetUp 0.35s ease backwards;
}
@keyframes sheetUp { from { transform: translateY(30%); opacity: 0; } }
.sheet-in { width: min(100%, 44rem); margin-inline: auto; display: grid; gap: 0.55rem; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.lbl { margin-top: 0.4rem; color: var(--gold); font-size: 0.85rem; }
.fld {
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 0.7rem;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  resize: vertical;
}
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.status { margin: 0; min-height: 1.4em; color: var(--ink-dim); font-size: 0.85rem; }
.toast {
  position: fixed;
  z-index: 3;
  inset-inline: 1rem;
  bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
  width: fit-content;
  max-width: calc(100% - 2rem);
  margin-inline: auto;
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  font-size: 0.92rem;
  text-align: center;
  animation: fade 0.5s ease backwards;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .pic::after { display: none; }
}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<div id="fx" aria-hidden="true"></div>

<button class="btn edit-btn" id="editBtn" type="button" hidden>تعديل ✎</button>

<main class="wrap">
  <section class="letter" id="letter">
    <div id="pages"></div>
  </section>
</main>

<nav class="nav" id="nav" aria-label="التنقل بين الصفحات">
  <div class="nav-in">
    <button class="btn" id="prev" type="button">→ السابق</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="btn primary" id="next" type="button">التالي ←</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" hidden></div>

<aside class="sheet" id="sheet" aria-label="تعديل الصفحة" hidden>
  <div class="sheet-in">
    <div class="sheet-head">
      <strong id="sheetTitle">تعديل الصفحة</strong>
      <button class="btn primary sm" id="done" type="button">تم</button>
    </div>

    <label class="lbl" for="fConf">الاعتراف (فوق)</label>
    <textarea class="fld" id="fConf" rows="3" dir="auto"></textarea>

    <div class="lbl">الصورة (في النص)</div>
    <div class="row">
      <label class="btn sm" for="fFile">اختار صورة</label>
      <input id="fFile" type="file" accept="image/*" hidden>
      <button class="btn sm" id="fClear" type="button">شيل الصورة</button>
    </div>

    <label class="lbl" for="fCap">سطر صغير تحت الصورة (اختياري)</label>
    <input class="fld" id="fCap" type="text" dir="auto">

    <label class="lbl" for="fV1">بيت الشعر: الصدر</label>
    <input class="fld" id="fV1" type="text" dir="auto">
    <label class="lbl" for="fV2">بيت الشعر: العجز</label>
    <input class="fld" id="fV2" type="text" dir="auto">

    <div id="finaleBox" hidden>
      <label class="lbl" for="fFin">الكلمة الكبيرة في آخر الصفحة الأخيرة</label>
      <input class="fld" id="fFin" type="text" dir="auto">
    </div>

    <div class="lbl">الصفحات</div>
    <div class="row">
      <button class="btn sm" id="fAdd" type="button">صفحة جديدة بعد دي</button>
      <button class="btn sm" id="fUp" type="button">قدّمها</button>
      <button class="btn sm" id="fDown" type="button">أخّرها</button>
      <button class="btn sm" id="fDel" type="button">امسح الصفحة</button>
    </div>

    <div class="lbl">حفظ ومشاركة</div>
    <div class="row">
      <button class="btn sm primary" id="fExpView" type="button">تحميل نسخة للمشاهدة (ابعتها ليها)</button>
      <button class="btn sm" id="fExpEdit" type="button">تحميل نسخة احتياطية قابلة للتعديل</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </div>
</aside>

<script>
/* نسخة نظيفة من الصفحة قبل ما أي حاجة تتعدل، بنستخدمها في التصدير */
const TEMPLATE = "<!doctype html>\n" + document.documentElement.outerHTML;

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
const arNum = (n) => String(n).replace(/\d/g, (d) => AR_DIGITS[d]);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};

/* ---------- Storage (IndexedDB, بتحفظ الصور كمان) ---------- */
const DB = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("love-site", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- State ---------- */
let state = { pages: [], finale: "بحبك" };
let editable = true;
let pageEls = [];
let cur = 0;
const pagesBox = $("pages");
const dotsBox = $("dots");
const prevBtn = $("prev");
const nextBtn = $("next");
const fx = $("fx");

/* ---------- Effects ---------- */
function burst(x, y, n, spread, rise) {
  if (REDUCE) return;
  spread = spread || 70; rise = rise || 140;
  for (let i = 0; i < n; i++) {
    const h = el("span", "hp", "♥");
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.fontSize = (14 + Math.random() * 18) + "px";
    h.style.color = Math.random() < 0.75 ? "var(--rose)" : "var(--gold)";
    fx.appendChild(h);
    const dx = (Math.random() - 0.5) * 2 * spread;
    const dy = -(rise * 0.5 + Math.random() * rise);
    const rot = (Math.random() - 0.5) * 50;
    const a = h.animate([
      { transform: "translate(-50%,-50%) scale(0.4)", opacity: 1 },
      { transform: "translate(calc(-50% + " + dx + "px),calc(-50% + " + dy + "px)) scale(1.1) rotate(" + rot + "deg)", opacity: 0 }
    ], { duration: 1100 + Math.random() * 900, easing: "cubic-bezier(.2,.7,.3,1)" });
    a.onfinish = () => h.remove();
  }
}
function confetti() {
  if (REDUCE) return;
  for (let i = 0; i < 26; i++) {
    setTimeout(() => burst(Math.random() * window.innerWidth, window.innerHeight * (0.75 + Math.random() * 0.2), 1, 40, window.innerHeight * 0.6), i * 70);
  }
}
document.addEventListener("pointerdown", (e) => {
  if (document.body.classList.contains("editing")) return;
  if (e.target.closest("button, a, input, textarea, label, aside, nav")) return;
  burst(e.clientX, e.clientY, 5);
});

/* ---------- Build pages ---------- */
function setWords(h, text, isStatic) {
  h.textContent = "";
  h.classList.toggle("static", !!isStatic);
  const words = String(text || "").split(/\s+/).filter(Boolean);
  words.forEach((w, i) => {
    const s = el("span", "w", w);
    s.style.setProperty("--i", i);
    h.appendChild(s);
    if (i < words.length - 1) h.appendChild(document.createTextNode(" "));
  });
}

function paintPhoto(page, p) {
  const fig = page.querySelector(".photo");
  const frame = page.querySelector(".frame");
  const img = frame.querySelector("img");
  fig.hidden = !p.photo && !editable;
  img.alt = p.caption || "";
  if (p.photo) {
    frame.classList.remove("missing");
    img.onerror = () => frame.classList.add("missing");
    img.onload = () => frame.classList.remove("missing");
    img.src = p.photo;
  } else {
    img.removeAttribute("src");
    frame.classList.add("missing");
  }
}

function buildPage(p, i) {
  const page = el("article", "page");
  page.appendChild(el("p", "eyebrow", "اعتراف " + arNum(i + 1)));

  const h = el("h2", "confession");
  h.tabIndex = -1;
  setWords(h, p.confession, false);
  page.appendChild(h);

  const fig = el("figure", "photo");
  const frame = el("div", "frame");
  const pic = el("div", "pic");
  const img = new Image();
  img.decoding = "async";
  const ph = el("div", "ph");
  ph.appendChild(el("span", null, "ضيف صورتك من زرار تعديل ✎"));
  pic.append(img, ph);
  frame.appendChild(pic);
  if (!REDUCE) {
    frame.addEventListener("pointermove", (e) => {
      const r = frame.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      frame.style.setProperty("--ry", (x * 14) + "deg");
      frame.style.setProperty("--rx", (-y * 14) + "deg");
    });
    frame.addEventListener("pointerleave", () => {
      frame.style.removeProperty("--rx");
      frame.style.removeProperty("--ry");
    });
  }
  fig.append(frame, el("figcaption", null, p.caption || ""));
  page.appendChild(fig);

  const verse = el("blockquote", "verse");
  const orn = el("span", "orn");
  orn.setAttribute("aria-hidden", "true");
  verse.append(el("p", "sadr", p.verse[0]), orn, el("p", "ajz", p.verse[1]));
  page.appendChild(verse);

  if (i === state.pages.length - 1) {
    const fin = el("div", "finale");
    fin.appendChild(el("p", "big", state.finale));
    page.appendChild(fin);
  }

  paintPhoto(page, p);
  return page;
}

function render() {
  pagesBox.textContent = "";
  dotsBox.textContent = "";
  pageEls = state.pages.map((p, i) => {
    const pg = buildPage(p, i);
    pagesBox.appendChild(pg);
    dotsBox.appendChild(document.createElement("i"));
    return pg;
  });
}

function updateCurrentText() {
  const p = state.pages[cur];
  const page = pageEls[cur];
  setWords(page.querySelector(".confession"), p.confession, true);
  page.querySelector("figcaption").textContent = p.caption || "";
  page.querySelector("img").alt = p.caption || "";
  page.querySelector(".sadr").textContent = p.verse[0];
  page.querySelector(".ajz").textContent = p.verse[1];
}

/* ---------- Navigation ---------- */
function show(n, o) {
  o = o || {};
  const last = pageEls.length - 1;
  cur = Math.max(0, Math.min(last, n));
  if (o.dir) pageEls[cur].style.setProperty("--dx", (o.dir * 28) + "px");
  pageEls.forEach((p, i) => p.classList.toggle("on", i === cur));
  [...dotsBox.children].forEach((d, i) => d.classList.toggle("on", i === cur));
  prevBtn.disabled = cur === 0;
  nextBtn.textContent = cur === last ? "من الأول ↺" : "التالي ←";
  window.scrollTo({ top: 0, behavior: "auto" });
  if (o.focus) pageEls[cur].querySelector(".confession").focus({ preventScroll: true });
  if (o.burst && cur === last && last > 0) setTimeout(() => { if (cur === last && !editing()) confetti(); }, 2800);
}
function next() {
  if (cur === pageEls.length - 1) show(0, { dir: -1, focus: true });
  else show(cur + 1, { dir: -1, focus: true, burst: true });
}
function prev() { show(cur - 1, { dir: 1, focus: true }); }
prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);

const editing = () => document.body.classList.contains("editing");
document.addEventListener("keydown", (e) => {
  if (editing()) return;
  if (e.key === "ArrowLeft") next();
  if (e.key === "ArrowRight") prev();
});

/* Swipe: في الاتجاه العربي السحب لليمين = الصفحة اللي بعدها */
let tx = null, ty = null;
document.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (tx == null || editing()) { tx = ty = null; return; }
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  tx = ty = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx > 0) { if (cur < pageEls.length - 1) next(); } else { prev(); }
}, { passive: true });

/* ---------- Save ---------- */
let saveTimer = 0;
function setStatus(msg) { $("status").textContent = msg; }
async function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = 0;
  try {
    await DB.set("state", { savedAt: Date.now(), pages: state.pages, finale: state.finale });
    setStatus("اتحفظ على الجهاز ده ✓");
  } catch (_) {
    setStatus("المتصفح مش سايبني أحفظ هنا. حمّل نسخة احتياطية عشان متضيعش.");
  }
}
function scheduleSave() {
  setStatus("بيتحفظ…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}

/* ---------- Export ---------- */
function exportHtml(forEdit) {
  const json = JSON.stringify({ editable: forEdit, exportedAt: Date.now(), pages: state.pages, finale: state.finale }).replace(/</g, "\\u003c");
  const html = TEMPLATE.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = forEdit ? "love-site-editable.html" : "love-site.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setStatus(forEdit ? "نزلت النسخة الاحتياطية القابلة للتعديل." : "نزلت نسخة المشاهدة. ابعتها ليها وهي تفتحها على طول.");
}

/* ---------- Editor ---------- */
const F = {
  conf: $("fConf"), cap: $("fCap"), v1: $("fV1"), v2: $("fV2"), file: $("fFile")
};
function fillFields() {
  const p = state.pages[cur];
  $("sheetTitle").textContent = "تعديل الصفحة " + arNum(cur + 1) + " من " + arNum(state.pages.length);
  F.conf.value = p.confession;
  F.cap.value = p.caption || "";
  F.v1.value = p.verse[0];
  F.v2.value = p.verse[1];
  $("finaleBox").hidden = cur !== state.pages.length - 1;
  $("fFin").value = state.finale;
}
function openEditor() {
  document.body.classList.add("editing");
  $("sheet").hidden = false;
  $("nav").hidden = true;
  $("editBtn").hidden = true;
  $("toast").hidden = true;
  setStatus("");
  fillFields();
}
async function closeEditor() {
  await saveNow();
  document.body.classList.remove("editing");
  $("sheet").hidden = true;
  $("nav").hidden = false;
  $("editBtn").hidden = false;
  show(cur, {});
}
$("editBtn").addEventListener("click", openEditor);
$("done").addEventListener("click", closeEditor);

F.conf.addEventListener("input", () => { state.pages[cur].confession = F.conf.value; updateCurrentText(); scheduleSave(); });
F.cap.addEventListener("input", () => { state.pages[cur].caption = F.cap.value; updateCurrentText(); scheduleSave(); });
F.v1.addEventListener("input", () => { state.pages[cur].verse[0] = F.v1.value; updateCurrentText(); scheduleSave(); });
$("fFin").addEventListener("input", () => {
  state.finale = $("fFin").value;
  const b = pagesBox.querySelector(".finale .big");
  if (b) b.textContent = state.finale;
  scheduleSave();
});
F.v2.addEventListener("input", () => { state.pages[cur].verse[1] = F.v2.value; updateCurrentText(); scheduleSave(); });

function readImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error("decode"));
      im.onload = () => {
        const MAX = 1200;
        const s = Math.min(1, MAX / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
F.file.addEventListener("change", async () => {
  const f = F.file.files && F.file.files[0];
  if (!f) return;
  setStatus("بجهّز الصورة…");
  try {
    state.pages[cur].photo = await readImage(f);
    paintPhoto(pageEls[cur], state.pages[cur]);
    scheduleSave();
  } catch (_) {
    setStatus("الصورة دي مش مدعومة. جرّب JPG أو PNG.");
  }
  F.file.value = "";
});
$("fClear").addEventListener("click", () => {
  state.pages[cur].photo = "";
  paintPhoto(pageEls[cur], state.pages[cur]);
  scheduleSave();
});

$("fAdd").addEventListener("click", () => {
  state.pages.splice(cur + 1, 0, {
    confession: "اكتب اعترافك هنا",
    photo: "",
    caption: "",
    verse: ["اكتب صدر البيت هنا", "واكتب عجزه هنا"]
  });
  render();
  show(cur + 1, {});
  fillFields();
  scheduleSave();
});
function move(d) {
  const j = cur + d;
  if (j < 0 || j >= state.pages.length) return;
  const t = state.pages[cur];
  state.pages[cur] = state.pages[j];
  state.pages[j] = t;
  render();
  show(j, {});
  fillFields();
  scheduleSave();
}
$("fUp").addEventListener("click", () => move(-1));
$("fDown").addEventListener("click", () => move(1));

let delTimer = 0;
$("fDel").addEventListener("click", () => {
  const btn = $("fDel");
  if (state.pages.length <= 1) { setStatus("لازم تسيب صفحة واحدة على الأقل."); return; }
  if (!delTimer) {
    btn.textContent = "متأكد؟ اضغط تاني";
    delTimer = setTimeout(() => { btn.textContent = "امسح الصفحة"; delTimer = 0; }, 3000);
    return;
  }
  clearTimeout(delTimer);
  delTimer = 0;
  btn.textContent = "امسح الصفحة";
  state.pages.splice(cur, 1);
  render();
  show(Math.min(cur, state.pages.length - 1), {});
  fillFields();
  scheduleSave();
});

$("fExpView").addEventListener("click", () => exportHtml(false));
$("fExpEdit").addEventListener("click", () => exportHtml(true));

/* ---------- Toast ---------- */
function toast(msg, ms) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  setTimeout(() => { t.hidden = true; }, ms || 6000);
}

/* ---------- Falling petals (ambient) ---------- */
(function petals() {
  if (REDUCE) return;
  const cv = $("petals");
  const cx = cv.getContext("2d");
  let W = 0, H = 0;
  const list = [];
  const make = (initial) => ({
    x: Math.random() * W,
    y: initial ? Math.random() * H : -20,
    s: 5 + Math.random() * 7,
    v: 0.18 + Math.random() * 0.32,
    sw: Math.random() * Math.PI * 2,
    sa: 0.3 + Math.random() * 0.6,
    r: Math.random() * Math.PI,
    rv: (Math.random() - 0.5) * 0.01,
    a: 0.1 + Math.random() * 0.18
  });
  function size() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    cx.setTransform(d, 0, 0, d, 0, 0);
    const count = Math.max(14, Math.min(40, Math.round(W / 28)));
    while (list.length < count) list.push(make(true));
    list.length = count;
  }
  function tick() {
    cx.clearRect(0, 0, W, H);
    for (const p of list) {
      p.y += p.v; p.sw += 0.01; p.x += Math.sin(p.sw) * p.sa; p.r += p.rv;
      if (p.y > H + 20) Object.assign(p, make(false));
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.r);
      cx.fillStyle = "rgba(231,137,159," + p.a + ")";
      cx.beginPath();
      cx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2);
      cx.fill();
      cx.restore();
    }
    requestAnimationFrame(tick);
  }
  size();
  window.addEventListener("resize", size);
  requestAnimationFrame(tick);
})();

/* ---------- Start ---------- */
(async function init() {
  let data;
  try { data = JSON.parse($("data").textContent); } catch (_) { data = { editable: true, exportedAt: 0, pages: [] }; }
  editable = data.editable !== false;
  state = { pages: data.pages, finale: typeof data.finale === "string" ? data.finale : "بحبك" };
  let firstRun = true;
  if (editable) {
    try {
      const saved = await DB.get("state");
      if (saved && Array.isArray(saved.pages) && saved.pages.length && (saved.savedAt || 0) >= (data.exportedAt || 0)) {
        state = { pages: saved.pages, finale: typeof saved.finale === "string" ? saved.finale : state.finale };
        firstRun = false;
      }
    } catch (_) {}
  }
  render();
  show(0, {});
  $("editBtn").hidden = !editable;
  if (editable && firstRun) toast("الصور اتحطت. الكلام تجريبي، اضغط «تعديل ✎» فوق عشان تغيّره.", 7000);
})();
</script>
